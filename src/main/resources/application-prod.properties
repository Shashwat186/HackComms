# Activate with SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hackcomms}
spring.datasource.username=${DATABASE_USERNAME:hackcomms}
spring.datasource.password=${DATABASE_PASSWORD:hackcomms}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

hackcomms.jwt.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
