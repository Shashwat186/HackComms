spring.application.name=hackcomms

# Local secrets (Nexconn keys, SMTP password) live in ./secrets.properties, which is gitignored.
# Copy secrets.properties.example to secrets.properties and fill it in.
spring.config.import=optional:file:./secrets.properties

# ---------- Database (dev default: H2 file DB, zero setup) ----------
# Data lives in ./data/hackcomms.mv.db and survives restarts. Delete ./data to reset.
spring.datasource.url=jdbc:h2:file:./data/hackcomms;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the DB at http://localhost:8080/h2-console  (JDBC URL above, user sa, no password)
spring.h2.console.enabled=true

server.error.include-message=always
server.error.include-stacktrace=never

# ---------- HackComms ----------
# Must be at least 32 characters. Override with the JWT_SECRET env var outside dev.
hackcomms.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
hackcomms.jwt.ttl-hours=168
hackcomms.otp.ttl-minutes=10
hackcomms.otp.max-attempts=5
hackcomms.otp.resend-cooldown-seconds=30
hackcomms.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Nexconn Chat. App Key/Secret come from the Nexconn Console (env vars or secrets.properties).
# api-base and area-code must match the data center your app was created in (SG / NA / ...).
hackcomms.nexconn.app-key=${NEXCONN_APP_KEY:}
hackcomms.nexconn.app-secret=${NEXCONN_APP_SECRET:}
hackcomms.nexconn.api-base=${NEXCONN_API_BASE:https://api.sg-light-api.com}
hackcomms.nexconn.area-code=${NEXCONN_AREA_CODE:SG}
# Verified LeetCode contest rating needed to be featured (everyone starts at 1500).
hackcomms.featured.min-rating=1600
# Team channels become read-only archives this many days after the hackathon ends.
hackcomms.teams.archive-after-days=7
# An admin-approved unarchive keeps the channel open for this many days.
hackcomms.teams.unarchive-days=14
hackcomms.mail.from=${MAIL_FROM:HackComms <no-reply@hackcomms.local>}

# ---------- Mail ----------
# Leave spring.mail.host unset in dev: OTPs are printed to the console instead of emailed.
# To send real mail (e.g. Gmail with an App Password), set:
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=you@gmail.com
# spring.mail.password=your-16-char-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
