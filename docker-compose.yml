# Optional: local Postgres to test the prod profile.
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=prod JWT_SECRET=<32+ chars> ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hackcomms
      POSTGRES_USER: hackcomms
      POSTGRES_PASSWORD: hackcomms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
